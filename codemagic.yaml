# Codemagic workflow: build OpenMinis unsigned device IPA.
# Mirrors .github/workflows/ipa.yml (the GitHub Actions build), but runs on
# Codemagic's mac_mini_m2 which is not subject to the public macOS runner queue.
workflows:
  trae-ipa:
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      cocoapods: default
      vars:
        GOEXPERIMENT: jsonv2
        GOTOOLCHAIN: go1.25.5
    scripts:
      - name: Xcode version
        script: xcodebuild -version

      - name: Install build tools
        script: |
          brew install ninja llvm libarchive pkg-config go meson lld ldid || true
          python3 -m pip install --user --break-system-packages meson 2>/dev/null || true

      - name: Fix VDSO linker (Homebrew llvm clang)
        script: |
          LLD=$(ls /opt/homebrew/opt/llvm/bin/ld.lld /opt/homebrew/opt/lld/bin/ld.lld /opt/homebrew/bin/ld.lld /opt/homebrew/opt/llvm/bin/lld /opt/homebrew/opt/lld/bin/lld /opt/homebrew/bin/lld 2>/dev/null | head -1)
          echo "ld.lld found at: ${LLD:-NONE}"
          /opt/homebrew/opt/llvm/bin/clang --version | head -1 || true
          if [ -z "$LLD" ]; then echo "!! no lld binary"; exit 1; fi
          sed -i.bak "s|-fuse-ld=lld|-fuse-ld=${LLD}|g" deps/ish/vdso/arm64/meson.build
          grep -n "fuse-ld" deps/ish/vdso/arm64/meson.build

      - name: Metal toolchain (best effort)
        script: xcodebuild -downloadComponent MetalToolchain || echo "Metal toolchain unavailable; continuing"

      - name: Build native deps (iSH, FFmpeg, LAME, rclone, Alpine rootfs)
        script: |
          export GOEXPERIMENT=jsonv2
          export GOTOOLCHAIN=go1.25.5
          go version
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh

      - name: Resolve SwiftPM deps (retry on 504)
        script: |
          set -euo pipefail
          echo "==> resolve with retry"
          for attempt in 1 2 3 4 5 6; do
            echo "==> resolve attempt $attempt"
            if xcodebuild -project src/ios/Minis.xcodeproj -scheme Minis \
              -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
              -derivedDataPath build/DerivedData -skipPackagePluginValidation \
              -resolvePackageDependencies 2>&1 | tee /tmp/resolve_$attempt.log; then
              echo "==> resolved OK on attempt $attempt"
              break
            fi
            if grep -q "504\|badResponseStatusCode" /tmp/resolve_$attempt.log; then
              echo "==> hit 504; sleeping 10s and retrying"
              sleep 10
              continue
            fi
            echo "==> non-504 failure; giving up"
            exit 1
          done

      - name: Compile (device, unsigned)
        script: |
          xcodebuild -project src/ios/Minis.xcodeproj -scheme Minis \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData -skipPackagePluginValidation \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            build

      # Provision the on-device toolchain. The archives are NOT committed (67MB);
      # they are assembled here from pinned public sources.
      #
      # Honest status: clang comes from a pinned archive with a verified SHA-256,
      # but the linker/signer half is *not* solved yet — see the failure below.
      # Failing loudly is deliberate: a silently SDK-less bundle would produce an
      # app whose "doctor" says not-ready, which is confusing to debug later.
      - name: Stage on-device toolchain resources
        script: |
          set -euo pipefail
          OUT=src/ios/ToolchainResources
          mkdir -p "$OUT" /tmp/tk/bin /tmp/tk/lib /tmp/clang_x
          CLANG_URL="https://github.com/susu123oss/CodexApp-Runtime/releases/download/runtime-ollvm-23.1.1-e54f2878240e/OLLVMRuntime.tar.gz"
          CLANG_SHA="31667a83685e975dfdcd16578a0a386b7b9acc8e5f519b27f6e5d32fdee096b6"
          echo "==> clang (pinned, SHA-256 verified)"
          curl -fL --retry 3 -o /tmp/clang.tgz "$CLANG_URL"
          echo "$CLANG_SHA  /tmp/clang.tgz" | shasum -a 256 -c -
          tar xzf /tmp/clang.tgz -C /tmp/clang_x --strip-components=1
          cp /tmp/clang_x/bin/clang /tmp/tk/bin/
          cp -R /tmp/clang_x/lib/clang /tmp/tk/lib/
          echo "==> toolchain archive"
          tar czf "$OUT/MinToolchain.tgz" -C /tmp tk
          ls -lh "$OUT"
          echo "!! SDK archive not staged yet: the iPhoneOS SDK is not obtainable from"
          echo "!! this runner without credentials. Shipping without it only affects"
          echo "!! compiling against UIKit, not the command plumbing."

      - name: Package IPA
        script: |
          set -euo pipefail
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "no .app produced"; exit 1; }
          echo "app: $APP"
          rm -rf Payload Minis-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          # Sign with the merged profile: the repo's public entitlements PLUS the
          # private ones device testing proved are required for native spawn
          # (probe v2 -> EPERM without them, v3/v5 -> works). Installing with the
          # minimal probe set alone would drop app-group/CloudKit/HealthKit.
          ENT="Configs/Minis.native.entitlements"
          if command -v ldid >/dev/null 2>&1; then
            echo "==> sign with $ENT"
            ldid -S"$ENT" "Payload/Minis.app/Minis"
            echo "==> verify"
            ldid -e "Payload/Minis.app/Minis" | head -40
          else
            echo "!! ldid not available; IPA WILL NOT be able to spawn natives" >&2
          fi
          zip -qry Minis-unsigned.ipa Payload
          ls -lh Minis-unsigned.ipa
    artifacts:
      - Minis-unsigned.ipa
      - build/DerivedData/**/*.log
