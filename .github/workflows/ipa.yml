# Unsigned device IPA for OpenMinis (Minis), for sideloading (TrollStore / AltStore / Sideloadly).
# The app ships a Linux sandbox, so the native dependencies (iSH, FFmpeg, LAME, rclone)
# are built from source by the deps/ scripts BEFORE the app is compiled. First build
# takes 30-60+ minutes; the deps are cached so later builds are fast.
#
# Speed notes (2026-11):
#  - deps cache is restored FIRST, so on a warm cache we skip brew/llvm, the VDSO linker
#    patch and the Metal toolchain download entirely (~5-7 min saved per run).
#  - DerivedData is cached with a prefix-based restore key, so a small Swift edit only
#    recompiles the touched targets instead of all 23 (~5 min saved on a warm run).
#  - concurrency cancels superseded runs instead of queuing them.
name: Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/tag/SHA to build (empty = current ref)'
        required: false
        type: string
      fresh:
        description: 'Ignore incremental-build cache (force a clean compile)'
        required: false
        type: boolean
        default: false
  push:
    branches: [workbuddy-1.15, ios-1.16-appgroup-fix]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'

permissions:
  contents: read

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          # iSH and PRoot sandboxes are submodules; without them build_ish.sh fails.
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode 26.3
        run: |
          XCODE=/Applications/Xcode_26.3.app
          [ -d "$XCODE" ] || { echo "Xcode 26.3 is missing on this runner"; exit 1; }
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      # ── Native deps (cached) ────────────────────────────────────────────────
      # Restored before the toolchain steps on purpose: everything below is only
      # needed when we actually have to (re)build the deps from source.
      - name: Cache native deps
        id: deps
        uses: actions/cache@v5
        with:
          path: |
            deps/lame-build
            deps/frameworks
            deps/libs
            deps/include
            deps/resources
          key: openminis-deps-${{ runner.os }}-${{ hashFiles('deps/build_lame.sh','deps/build_ffmpeg.sh','deps/build_ish.sh','deps/prepare_alpine_rootfs.sh','deps/build_rclone_ios.sh') }}

      - name: Install build tools
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          brew install ninja llvm libarchive pkg-config go meson lld ldid
          python3 -m pip install --user --break-system-packages meson 2>/dev/null || true

      - name: Fix VDSO linker (Homebrew llvm clang)
        if: steps.deps.outputs.cache-hit != 'true'
        # iSH's vdso custom_target hardcodes `-fuse-ld=lld`, but Homebrew's
        # llvm clang on the macOS runner rejects the short name ("invalid
        # linker name in argument '-fuse-ld=lld'"). Pointing -fuse-ld at the
        # absolute lld path bypasses the name check (LLVM uses any path verbatim).
        run: |
          # Prefer ld.lld (the Unix ELF linker); the generic `lld` driver is a
          # multi-target dispatcher and refuses to link directly.
          LLD=$(ls /opt/homebrew/opt/llvm/bin/ld.lld /opt/homebrew/opt/lld/bin/ld.lld /opt/homebrew/bin/ld.lld /opt/homebrew/opt/llvm/bin/lld /opt/homebrew/opt/lld/bin/lld /opt/homebrew/bin/lld 2>/dev/null | head -1)
          echo "ld.lld found at: ${LLD:-NONE}"
          /opt/homebrew/opt/llvm/bin/clang --version | head -1 || true
          if [ -z "$LLD" ]; then echo "!! no lld binary"; exit 1; fi
          sed -i.bak "s|-fuse-ld=lld|-fuse-ld=${LLD}|g" deps/ish/vdso/arm64/meson.build
          grep -n "fuse-ld" deps/ish/vdso/arm64/meson.build

      - name: Metal Toolchain
        if: steps.deps.outputs.cache-hit != 'true'
        # Recent Xcode ships the Metal toolchain as a separate component. FFmpeg's
        # configure probes for it and silently drops the Metal-backed deinterlace
        # filter when missing, so fetch it when possible, but don't fail the build.
        run: xcodebuild -downloadComponent MetalToolchain || echo "Metal toolchain unavailable; continuing"

      - name: Build native deps
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          # go-json-experiment/json's alias.go needs encoding/json's v2
          # experiment symbols (json.SkipFunc / json.DiscardUnknownMembers),
          # and it matches the Go 1.25 series (go.mod says `go 1.25.5`).
          # Go 1.27.3's encoding/json reorganized these, so pin the toolchain.
          export GOEXPERIMENT=jsonv2
          export GOTOOLCHAIN=go1.25.5
          go version
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh

      # ldid is needed for packaging even on a warm deps cache; it is a tiny
      # bottle (~1s) so it is not worth gating behind the deps cache.
      - name: Ensure ldid
        run: command -v ldid >/dev/null || brew install ldid

      # ── App build (incremental) ─────────────────────────────────────────────
      - name: Restore DerivedData
        id: dd
        if: inputs.fresh != true
        uses: actions/cache@v5
        with:
          # Only the parts an incremental build actually needs: Build/ holds the
          # object files and products, SourcePackages/ the resolved SPM checkouts.
          # Index.noindex and Logs are skipped — they are large and not reused.
          path: |
            build/DerivedData/Build
            build/DerivedData/SourcePackages
          key: dd-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('src/ios/**/*.swift','src/ios/Minis.xcodeproj/**') }}
          restore-keys: |
            dd-${{ runner.os }}-${{ github.ref_name }}-
            dd-${{ runner.os }}-

      - name: Compile (device, unsigned)
        shell: bash
        env:
          # Let xcodebuild use every performance core on the runner.
          IDEBuildOperationMaxNumberOfConcurrentCompileTasks: 12
        run: |
          mkdir -p build
          xcodebuild -project src/ios/Minis.xcodeproj -scheme Minis \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData -skipPackagePluginValidation \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            build | tee build/xcodebuild.log
          # GitHub's bash shell already runs with -eo pipefail, so a failing
          # xcodebuild propagates through tee on its own.

      - name: Check for warnings
        if: always()
        run: |
          LOG=build/xcodebuild.log
          [ -f "$LOG" ] || exit 0
          W=$(grep -c 'warning:' "$LOG" || true)
          E=$(grep -c 'error:' "$LOG" || true)
          echo "warnings=${W:-0} errors=${E:-0}" >> $GITHUB_STEP_SUMMARY

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "no .app produced"; exit 1; }
          echo "app: $APP"
          VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" 2>/dev/null || echo 0)
          MINOS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist" 2>/dev/null || echo '?')
          echo "version=$VER minOS=$MINOS" >> $GITHUB_STEP_SUMMARY
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_STEP_SUMMARY
          rm -rf Payload Minis-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          # TrollStore 未签名 IPA 需显式注入 entitlements（App Group 缺失会启动闪退）
          command -v ldid >/dev/null && { echo "==> inject App Group entitlements"; ldid -S"src/ios/Minis.entitlements" "Payload/Minis.app/Minis"; }
          zip -qry Minis-unsigned.ipa Payload
          ls -lh Minis-unsigned.ipa
          SIZE=$(du -m Minis-unsigned.ipa | cut -f1)
          SHA=$(shasum -a 256 Minis-unsigned.ipa | cut -d' ' -f1)
          echo "size=${SIZE}MB sha256=$SHA" >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v5
        with:
          name: Minis-unsigned-ipa
          path: Minis-unsigned.ipa
          retention-days: 30